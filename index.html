<!DOCTYPE html>
<html>
<head>
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Happy Birthday Kajuuuuuuuuuu ❤️</h1>
<p>Enter our special date to continue 💕</p>

<input type="password" id="password" placeholder="DDMMYYYY">
<br><br>

<button onclick="checkPassword()">Unlock ❤️</button>

<p id="error" style="color:red;"></p>
<img src="kaju.jpg" id="wrong-img" class="center-img" style="display:none;">
    
<audio id="bg-music" loop>
    <source src="pillu.mp3" type="audio/mpeg">
</audio>
    
<script>
function checkPassword() {
    var input = document.getElementById("password").value;

    // 👉 CHANGE THIS to your anniversary date
    var correctPassword = "13082025";  

    if(input === correctPassword) {
        var audio = document.getElementById("bg-music");

        audio.play().then(() => {
            // Save that music started
            sessionStorage.setItem("musicPlaying", "true");
            sessionStorage.setItem("musicTime", audio.currentTime);

            // Small delay for smoother transition
            setTimeout(() => {
                window.location.href = "page1.html";
            }, 300);
        }).catch(() => {
            // fallback (still go ahead)
            window.location.href = "page1.html";
        });
    } else {
        document.getElementById("error").innerText = "Wrong date 😢 PITAI HOGI!";
        document.getElementById("wrong-img").style.display = "block";
    }
}
</script>
<img src="photo1.png" class="left-img">
<img src="photo2.png" class="right-img">
</body>
</html>
