<!DOCTYPE html>
<html>
<head>
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Happy Birthday ❤️</h1>
<p>Enter our special date to continue 💕</p>

<input type="password" id="password" placeholder="DDMMYYYY">
<br><br>

<button onclick="checkPassword()">Unlock ❤️</button>

<p id="error" style="color:red;"></p>

<script>
function checkPassword() {
    var input = document.getElementById("password").value;

    // 👉 CHANGE THIS to your anniversary date
    var correctPassword = "14022023";  

    if(input === correctPassword) {
        window.location.href = "page1.html";
    } else {
        document.getElementById("error").innerText = "Wrong date 😢 Try again!";
    }
}
</script>

</body>
</html>
